services:
  backend:
    build: ./backend
    image: pdf-logo-stamper-backend
    environment:
      DATA_DIR: /app/data
      CORS_ORIGINS: "*"
      PREVIEW_DPI: ${PREVIEW_DPI:-110}
    volumes:
      - stamper_data:/app/data
    ports:
      - "127.0.0.1:${BACKEND_DEBUG_PORT:-9012}:9010"   # /docs + debug (เฉพาะเครื่อง)
    expose:
      - "9010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9010/api/health',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: pdf-logo-stamper-frontend
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stamper_data:
